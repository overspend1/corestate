# CoreState Analytics Engine Configuration

# Spark Configuration
spark {
  master = "local[*]"  # Use "spark://host:port" for cluster mode
  master = ${?SPARK_MASTER}

  checkpoint.location = "/tmp/spark-checkpoints"
  checkpoint.location = ${?SPARK_CHECKPOINT_LOCATION}

  shuffle.partitions = 200
  shuffle.partitions = ${?SPARK_SHUFFLE_PARTITIONS}
}

# HTTP Server Configuration
http {
  host = "0.0.0.0"
  host = ${?HTTP_HOST}

  port = 8086
  port = ${?HTTP_PORT}
}

# Prometheus Metrics
prometheus {
  port = 9095
  port = ${?PROMETHEUS_PORT}
}

# Kafka Configuration
kafka {
  bootstrap.servers = "localhost:9092"
  bootstrap.servers = ${?KAFKA_BOOTSTRAP_SERVERS}

  topics {
    backup-events = "backup-events"
    anomalies = "backup-anomalies"
  }

  consumer {
    group.id = "analytics-engine-consumer"
    auto.offset.reset = "latest"
  }
}

# Data Lake Configuration
data-lake {
  base-path = "s3a://corestate-data-lake"
  base-path = ${?DATA_LAKE_BASE_PATH}

  paths {
    backup-events = ${data-lake.base-path}"/backup-events"
    realtime-stats = ${data-lake.base-path}"/realtime-stats"
    anomalies = ${data-lake.base-path}"/anomalies"
    checkpoints = ${data-lake.base-path}"/checkpoints"
  }
}

# InfluxDB Configuration
influxdb {
  url = "http://localhost:8086"
  url = ${?INFLUXDB_URL}

  database = "corestate_analytics"
  username = "admin"
  password = "changeme"
  password = ${?INFLUXDB_PASSWORD}
}

# Elasticsearch Configuration
elasticsearch {
  nodes = "localhost:9200"
  nodes = ${?ELASTICSEARCH_NODES}

  index = "corestate-backups"
  username = "elastic"
  password = "changeme"
  password = ${?ELASTICSEARCH_PASSWORD}
}

# Analytics Configuration
analytics {
  # Window configurations
  window {
    realtime-duration = "5 minutes"
    realtime-slide = "1 minute"
    watermark = "10 minutes"
  }

  # Anomaly detection
  anomaly {
    threshold = 0.8
    model-path = "/models/anomaly-detection"
  }

  # Processing triggers
  triggers {
    console = "30 seconds"
    parquet = "2 minutes"
    influxdb = "30 seconds"
    alerting = "15 seconds"
  }
}

# Logging
logging {
  level = "INFO"
  level = ${?LOG_LEVEL}

  pattern = "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
}
