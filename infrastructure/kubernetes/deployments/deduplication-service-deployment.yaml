apiVersion: apps/v1
kind: Deployment
metadata:
  name: deduplication-service
  namespace: corestate
  labels:
    app: deduplication-service
    component: storage
    version: "2.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deduplication-service
  template:
    metadata:
      labels:
        app: deduplication-service
        component: storage
        version: "2.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: deduplication-service
        image: ghcr.io/overspend1/corestate-deduplication-service:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8001
          protocol: TCP
        env:
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: REDIS_DB
          value: "1"
        - name: CHUNK_SIZE
          value: "4194304"
        - name: MIN_CHUNK_SIZE
          value: "2097152"
        - name: MAX_CHUNK_SIZE
          value: "8388608"
        - name: HASH_ALGORITHM
          value: "blake2b"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "512Mi"
            cpu: "300m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: deduplication-service
  namespace: corestate
  labels:
    app: deduplication-service
    component: storage
spec:
  type: ClusterIP
  ports:
  - port: 8001
    targetPort: 8001
    protocol: TCP
    name: http
  selector:
    app: deduplication-service
