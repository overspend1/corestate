apiVersion: apps/v1
kind: Deployment
metadata:
  name: compression-engine
  namespace: corestate
  labels:
    app: compression-engine
    component: storage
    version: "2.0.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: compression-engine
  template:
    metadata:
      labels:
        app: compression-engine
        component: storage
        version: "2.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: compression-engine
        image: ghcr.io/overspend1/corestate-compression-engine:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: RUST_LOG
          value: "info"
        - name: BIND_ADDRESS
          value: "0.0.0.0:8080"
        - name: MAX_COMPRESSION_THREADS
          value: "4"
        - name: DEFAULT_ALGORITHM
          value: "zstd"
        - name: ZSTD_LEVEL
          value: "3"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: compression-engine
  namespace: corestate
  labels:
    app: compression-engine
    component: storage
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: compression-engine
